<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if product %}Edit Product{% else %}Add Product{% endif %}</title>
</head>
<body>
    <h1>{% if product %}Edit Product{% else %}Add Product{% endif %}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% if product %}Update{% else %}Create{% endif %}</button>
    </form>
    <a href="{% url 'product_list' %}">Back to Product List</a>
</body>
</html>
