{% extends 'base.html' %}
{% block title %}Delete Product | Malangas Glass{% endblock title %}
{% block body %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Product</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f8fb; }
        .container { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 32px 40px; }
        h1 { text-align: center; color: #e74c3c; margin-bottom: 32px; }
        p { text-align: center; color: #34495e; }
        form { display: flex; flex-direction: column; align-items: center; }
        button { margin-top: 24px; background: #e74c3c; color: #fff; padding: 12px 32px; border: none; border-radius: 6px; font-size: 1em; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #c0392b; }
        .back-link { display: inline-block; margin-top: 18px; color: #3498db; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Delete Product</h1>
        <p>Are you sure you want to delete <strong>{{ product.name }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Yes, Delete</button>
        </form>
        <a href="{% url 'product_list' %}" class="back-link">&larr; Cancel</a>
    </div>
</body>
</html>
{% endblock body %}
